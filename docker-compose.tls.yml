# =============================================================================
# WebProtege TLS overlay  (alt: drop back-channel issuer-uri in dev)
# =============================================================================
#
# Adds a Caddy sidecar that terminates TLS on 443, proxying to webprotege-
# nginx:80 with the X-Forwarded-* headers downstream services rely on.
# Apply alongside the base compose:
#
#   # dev with locally-trusted cert (mkcert):
#   make dev-certs
#   make dev-https-up
#
#   # single-host prod with auto-letsencrypt:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  -f docker-compose.tls.yml \
#                  --env-file .env.prod up -d
#
#   # LB-fronted prod (AWS ELB / external nginx): do NOT include this file —
#   # the LB terminates TLS and forwards plain HTTP to webprotege-nginx
#   # directly.
#
# What this overlay does — and what it deliberately does NOT do:
#
# 1. Adds the Caddy sidecar; drops webprotege-nginx's host port binding
#    (Caddy becomes the only public entry point).
#
# 2. For the four JVM services that previously did back-channel HTTPS to
#    the public hostname (api-gateway, user-management, event-history,
#    gwt-ui-server), it redirects their Keycloak-related URLs to the
#    INTERNAL bridge (http://webprotege-keycloak:8080/keycloak), and
#    blanks the Spring OAuth2 issuer-uri properties.  Net effect: no
#    back-channel HTTPS, no JVM trust-store plumbing.
#
# 3. Browser traffic — the only thing developers actually see — still
#    goes through Caddy with TLS termination.  All the URLs Keycloak
#    embeds for browser flows (issuer claim in JWTs, authorization
#    endpoint, logout URL) are still https://<SERVER_HOST>/... because
#    Keycloak's KC_HOSTNAME and realm frontendUrl are set to the public
#    URL.  Spring on the api-gateway side validates JWTs by signature
#    via the bridge-internal JWK set URI — that's the real security
#    boundary; issuer-claim matching is defense-in-depth.
#
# Trade-off:
#   - Lost in dev: issuer-claim validation on the JWT, and Spring's
#     boot-time sanity check that the discovery doc's issuer matches
#     the configured issuer-uri.
#   - Gained: a substantially simpler dev setup — no per-image
#     entrypoint overrides, no JVM truststore mounts, no extra_hosts
#     additions.
#
# In prod (single-host Caddy + auto-LE, or LB-fronted) the JVM trusts
# the real LE cert out of the box, so this overlay leaves prod's
# issuer-uri values intact and prod keeps full validation.  The dev-
# specific overrides are gated by the Makefile's dev-https-up target.

services:

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # mkcert outputs live in ./certs (generated by bin/dev-setup-certs).
      # In prod with auto-letsencrypt this mount is harmless — Caddy writes
      # the issued cert into the named volume below regardless.
      - ./certs:/etc/caddy/certs:ro
      # Persistent state for Caddy: issued certs, OCSP staples, ACME account
      # keys.  Wiping this volume forces a full re-issue on next start.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Sane defaults match the dev mkcert path; prod overlay or .env can
      # override.  See caddy/Caddyfile header for the matrix.
      CADDY_HTTPS_SITE: ${CADDY_HTTPS_SITE:-${SERVER_HOST:-webprotege-local.edu}}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-tls /etc/caddy/certs/cert.pem /etc/caddy/certs/key.pem}
      # Default must be non-empty: Caddyfile `{$VAR:default}` substitution
      # only uses the default when VAR is *unset*, not when it's set-but-empty.
      # Passing an empty value here would cause Caddy to barf on `email \n`
      # in the Caddyfile.  Real prod deployments override this with an ops
      # contact address so letsencrypt expiry reminders go somewhere useful.
      CADDY_LETSENCRYPT_EMAIL: ${CADDY_LETSENCRYPT_EMAIL:-dev-noreply@example.invalid}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    depends_on:
      - webprotege-nginx
    networks:
      - webprotege
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Strip the host port binding from webprotege-nginx — Caddy is now the
  # only public entry point.
  webprotege-nginx:
    ports: !reset []

  # --------------------------------------------------------------------------
  # Dev simplification: skip back-channel HTTPS for the four JVM services
  # that would otherwise need the mkcert CA in their truststore.
  #
  # The empty string for SPRING_SECURITY_OAUTH2_*_ISSUER_URI relies on
  # Spring's StringUtils.hasText() check treating "" as unset, so the
  # auto-config doesn't attempt the discovery-doc fetch.  Spring falls
  # back to the explicit token-uri / jwk-set-uri / user-info-uri (set in
  # the base compose to the internal bridge http://webprotege-keycloak:8080/).
  #
  # The other env vars repoint the keycloak.serverUrl and KEYCLOAK_AUTH_URL
  # values at the same internal bridge so the legacy Tomcat Keycloak
  # adapter (in gwt-ui-server) and the admin-API callers (user-management,
  # event-history) also avoid back-channel HTTPS.
  #
  # In LB-fronted prod or single-host prod with a real LE cert, this
  # overlay's "dev simplification" actually still works — pointing back-
  # channel calls at the internal bridge bypasses the LB entirely, which
  # is more efficient and avoids the LB-loopback-NAT class of problems.
  # The issuer-uri blanking is the only thing that arguably regresses
  # prod security posture; if that matters for a particular prod setup,
  # this overlay would need to be split into a dev-only piece and a
  # prod-tls piece.
  # --------------------------------------------------------------------------

  webprotege-gwt-api-gateway:
    environment:
      # Skip Spring's boot-time OIDC discovery doc fetch.  YAML `~` (null)
      # in compose results in the variable being *unset* in the container,
      # which is what Spring needs — empty string is rejected by
      # ClientRegistrations.fromIssuerLocation as "issuer cannot be empty".
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: ~
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ~

  webprotege-gwt-ui-server:
    environment:
      # The legacy org.keycloak.adapters Tomcat adapter uses this URL to
      # fetch the OIDC discovery doc on first request.  Point at the
      # internal bridge — plain HTTP, no trust issue.  The auth URLs the
      # adapter then issues to the browser come from the discovery doc's
      # contents (which Keycloak emits as https://${SERVER_HOST}/keycloak/...
      # because of KC_HOSTNAME), so the browser-facing flow is still
      # fully https.
      KEYCLOAK_AUTH_URL: http://webprotege-keycloak:8080/keycloak/

  webprotege-user-management-service:
    environment:
      # webprotege.keycloak.serverUrl is used for admin-API calls.
      webprotege.keycloak.serverUrl: http://webprotege-keycloak:8080/keycloak

  webprotege-event-history-service:
    environment:
      webprotege.keycloak.serverUrl: http://webprotege-keycloak:8080/keycloak

volumes:
  caddy-data:
  caddy-config:
